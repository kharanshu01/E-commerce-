<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — FashionHub</title>
  <link rel="icon" href="assets/images/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <div id="site-header"></div>
  <main class="py-5">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center flex-wrap mb-4">
        <div><h1 class="mb-1">Admin Dashboard</h1><p class="text-muted mb-0">Manage customers, orders, and inventory.</p></div>
        <button id="refresh-admin" class="btn btn-outline-primary"><i class="fas fa-sync-alt mr-1"></i>Refresh</button>
      </div>
      <div id="admin-error"></div>
      <div class="row mb-4" id="admin-stats"></div>
      <div class="order-summary mb-4"><h5>Recent Orders</h5><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="admin-orders"></tbody></table></div></div>
      <div class="row">
        <div class="col-lg-7 mb-4"><div class="order-summary h-100"><h5>Registered Customers</h5><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody id="admin-users"></tbody></table></div></div></div>
        <div class="col-lg-5 mb-4"><div class="order-summary h-100"><h5>Inventory</h5><div class="table-responsive"><table class="table table-hover"><thead><tr><th>Product</th><th>Stock</th><th>Price</th></tr></thead><tbody id="admin-products"></tbody></table></div></div></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
