<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — FashionHub</title>
  <link rel="icon" href="assets/images/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <div id="site-header"></div>

  <main class="py-5">
    <div class="container">
      <div class="section_title text-center mb-5"><h1>Checkout</h1></div>
      <form id="checkout-form">
        <div class="row">
          <div class="col-lg-8 mb-4">
            <div class="order-summary" style="position:static">
              <h5 class="mb-4"><i class="fas fa-truck mr-2 text-gradient"></i>Shipping Details</h5>
              <div class="form-row">
                <div class="form-group col-md-6"><label>First name *</label><input name="firstName" class="form-control" required></div>
                <div class="form-group col-md-6"><label>Last name *</label><input name="lastName" class="form-control" required></div>
              </div>
              <div class="form-row">
                <div class="form-group col-md-6"><label>Phone *</label><input name="phone" type="tel" class="form-control" required></div>
                <div class="form-group col-md-6"><label>Email *</label><input name="email" type="email" class="form-control" required></div>
              </div>
              <div class="form-group"><label>Address Line 1 *</label><input name="address1" class="form-control" placeholder="House number and street name" required></div>
              <div class="form-group"><label>Address Line 2</label><input name="address2" class="form-control" placeholder="Apartment, suite, etc. (optional)"></div>
              <div class="form-row">
                <div class="form-group col-md-4"><label>City *</label><input name="city" class="form-control" required></div>
                <div class="form-group col-md-4"><label>Postcode *</label><input name="postcode" class="form-control" required></div>
                <div class="form-group col-md-4"><label>Country *</label>
                  <select name="country" class="form-control" required>
                    <option value="">Choose...</option><option>India</option><option>United States</option><option>United Kingdom</option><option>Other</option>
                  </select>
                </div>
              </div>
              <div class="form-group"><label>Order notes</label><textarea name="notes" rows="2" class="form-control"></textarea></div>

              <h5 class="mb-3 mt-4"><i class="fas fa-credit-card mr-2 text-gradient"></i>Payment (Demo)</h5>
              <div class="alert alert-info"><i class="fas fa-info-circle mr-2"></i>This is a simulated payment for demonstration — no real card is charged.</div>
              <div class="form-check mb-2"><input class="form-check-input" type="radio" name="pay" id="pay1" checked><label class="form-check-label" for="pay1">Cash on Delivery</label></div>
              <div class="form-check"><input class="form-check-input" type="radio" name="pay" id="pay2"><label class="form-check-label" for="pay2">Card (Simulated)</label></div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="order-summary" id="checkout-summary"></div>
          </div>
        </div>
      </form>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/checkout.js"></script>
</body>
</html>
