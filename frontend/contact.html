<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us — FashionHub</title>
  <link rel="icon" href="assets/images/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <div id="site-header"></div>

  <main class="py-5">
    <div class="container">
      <div class="section_title text-center mb-5 reveal">
        <h1>Contact us</h1>
        <p>We’re here to help with orders, styling advice, or any questions about your cart.</p>
      </div>
      <div class="row">
        <div class="col-lg-7 mb-4 reveal">
          <div class="contact-card">
            <form>
              <div class="form-row">
                <div class="form-group col-md-6">
                  <label>Name</label>
                  <input class="form-control" placeholder="Your name">
                </div>
                <div class="form-group col-md-6">
                  <label>Email</label>
                  <input type="email" class="form-control" placeholder="you@example.com">
                </div>
              </div>
              <div class="form-group">
                <label>Message</label>
                <textarea class="form-control" rows="5" placeholder="Tell us how we can help..."></textarea>
              </div>
              <button class="btn btn-primary" type="button" onclick="window.toast && window.toast('Message received — we will be in touch soon.','success')">Send message</button>
            </form>
          </div>
        </div>
        <div class="col-lg-5 reveal">
          <div class="contact-card">
            <div class="info-icon"><i class="fas fa-envelope"></i></div>
            <h4>Get in touch</h4>
            <p class="mb-3"><i class="fas fa-phone-alt mr-2"></i> +91 8249842181</p>
            <p class="mb-3"><i class="fas fa-envelope mr-2"></i> support@fashionhub.com</p>
            <p class="mb-0"><i class="fas fa-map-marker-alt mr-2"></i> Angul, Odisha 759122</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
</body>
</html>
