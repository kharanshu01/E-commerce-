<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — FashionHub</title>
  <link rel="icon" href="assets/images/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <div id="site-header"></div>

  <main class="py-5 min-vh-70 d-flex align-items-center">
    <div class="container">
      <div class="auth-card">
        <div class="brand mb-1">FashionHub</div>
        <p class="text-center text-muted mb-4">Welcome back — please sign in.</p>
        <form id="login-form">
          <div class="form-group">
            <label>Email</label>
            <input name="email" type="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label>Password</label>
            <input name="password" type="password" class="form-control" placeholder="••••••" required>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Sign In</button>
        </form>
        <div class="alert alert-light border mt-3 mb-0 small">
          <strong>Demo logins</strong><br>
          Admin: <code>admin@fashionhub.com</code> / <code>admin123</code><br>
          User: <code>user@fashionhub.com</code> / <code>user123</code>
        </div>
        <p class="text-center mt-3 mb-0">No account? <a href="register.html" class="text-gradient font-weight-bold">Sign up</a></p>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
