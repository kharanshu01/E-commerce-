<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search — FashionHub</title>
  <link rel="icon" href="assets/images/logo.svg">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body id="top">
  <div id="site-header"></div>

  <main class="py-5">
    <div class="container">
      <div class="section_title text-center mb-5 reveal">
        <h1>Find what you need</h1>
        <p>Discover products by style, search term, or browse our popular categories.</p>
      </div>
      <div class="search-card reveal">
        <div class="form-group mb-3">
          <input id="search-page-input" class="form-control form-control-lg" placeholder="Try dress, headphones, phone, or beauty" autocomplete="off">
        </div>
        <div class="mb-3">
          <span class="search-chip" onclick="window.location.href='product.html?category=Women'">Women</span>
          <span class="search-chip" onclick="window.location.href='product.html?category=Men'">Men</span>
          <span class="search-chip" onclick="window.location.href='product.html?sort=newest'">New arrivals</span>
          <span class="search-chip" onclick="window.location.href='product.html?sort=rating'">Top rated</span>
        </div>
        <div id="search-meta" class="text-muted small mb-3"></div>
        <div id="search-results" class="row"></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/render.js"></script>
  <script>
    (async function () {
      const input = document.getElementById('search-page-input');
      const results = document.getElementById('search-results');
      const meta = document.getElementById('search-meta');
      let searchTimer;
      let requestNumber = 0;
      async function runSearch(term = '') {
        const currentRequest = ++requestNumber;
        results.innerHTML = '<div class="col-12"><div class="spinner"></div></div>';
        try {
          const params = new URLSearchParams();
          if (term) params.set('search', term);
          params.set('limit', 6);
          const { items, total } = await window.API.get(`/products?${params}`);
          if (currentRequest !== requestNumber) return;
          meta.textContent = `${total || 0} result${total === 1 ? '' : 's'} found`;
          window.Render.renderProducts(results, items, 'No products found for this search.');
        } catch (err) {
          if (currentRequest !== requestNumber) return;
          results.innerHTML = `<div class="col-12"><div class="empty-state"><i class="fas fa-plug"></i><h4>${err.message}</h4></div></div>`;
        }
      }
      input.addEventListener('input', (e) => {
        clearTimeout(searchTimer);
        const term = e.target.value.trim();
        searchTimer = setTimeout(() => runSearch(term), 300);
      });
      const initialTerm = window.qs('search') || '';
      input.value = initialTerm;
      runSearch(initialTerm);
    })();
  </script>
</body>
</html>
