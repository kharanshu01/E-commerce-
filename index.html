<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FashionHub — Modern E-commerce</title>
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <link rel="icon" href="frontend/assets/images/logo.svg">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', Arial, sans-serif;
      background: linear-gradient(135deg, #6d28d9 0%, #ec4899 100%);
      color: #fff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }

      padding: 32px;
      box-shadow: 0 18px 50px rgba(17, 12, 46, 0.16);
      max-width: 520px;
    }
    a {
      color: #fff;
      font-weight: 600;
      text-decoration: underline;
    }
  </style>
</head>

  <div class="box">
    <h1>FashionHub</h1>
    <p>You’re being redirected to the main storefront.</p>

</html>
